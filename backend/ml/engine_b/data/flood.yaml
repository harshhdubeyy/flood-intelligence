# YOLOv8 Flood Detection Dataset Configuration
# Flood Intelligence Platform (FIP) - ML Engine B

# Root directory of dataset (can be absolute or relative to dataset YAML)
path: ./dataset

# Train, validation, and test image directories (relative to 'path')
train: images/train
val: images/val
test: images/test  # optional

# Custom Flood Classes for Urban Inundation
# Note: Standard COCO does not have these classes. They require fine-tuning.
names:
  0: flood_water
  1: waterlogged_road
  2: submerged_vehicle
  3: person_in_flood

# Dataset Directory Layout:
# dataset/
# ├── images/
# │   ├── train/  # Training images (.jpg, .png)
# │   └── val/    # Validation images (.jpg, .png)
# └── labels/
#     ├── train/  # YOLO format annotations (.txt)
#     └── val/    # YOLO format annotations (.txt)
#
# Each .txt annotation file contains one row per bounding box:
# <class_index> <x_center> <y_center> <width> <height>
# (All coordinates normalized to [0.0, 1.0])
